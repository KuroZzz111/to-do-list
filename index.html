<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
     <section class="card">
        <h2>To Do List </h2>
        <p class="description">Tambahkan Tugas</p>
        <div class="input-container">
            <input type="text" id="input-task" placeholder="Tambahkan To Do List" autocomplete="off">
            <button id="btn-add" class="btn btn-success"> Tambah</button>
        </div>
        <div class="list-container">
            <h3>Tugas Hari ini (<span id="amount-tasks">0</span>):</h3>
            <ul id="list-tasks" class="note-list"></ul>
            <p id="empty-massage" class="empty-state">Isi Tugas</p>
        </div>
    <script src="app.js"></script>
</body>

</html>
